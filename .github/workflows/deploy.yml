# Ships +1 Slide Downhill to Boxity Legion: the dev branch to the dev (playtest)
# channel, main to production - on Boxity's production platform (bloxity.io) always,
# and on its stage platform (stage.bloxity.io) too once LEGION_DEPLOY_TOKEN_STAGE is
# set. Each platform is its own job, so a stage failure never blocks or undoes prod.
#
#   server   -> Docker image in this repo's GitHub Container Registry (tagged per
#               platform), then Legion rolls it out (1-slide-downhill.host.<platform>)
#   frontend -> the built client, served at 1-slide-downhill.play.<platform> (prod
#               channel) and 1-slide-downhill.dev.play.<platform> (dev channel)
#
# One build for both platforms: the platform tells the game where it is at runtime
# (window.BLOXITY_ENV), so no environment or Boxity URL goes into the client build.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   LEGION_DEPLOY_TOKEN        from hosting.bloxity.io (required)
#   LEGION_DEPLOY_TOKEN_STAGE  from hosting.stage.bloxity.io (optional: turns stage on)
# After the first run, make the ghcr.io package public so Legion can pull it
# (repo -> Packages -> 1-slide-downhill-server -> Package settings -> Change visibility).
#
# Run it by hand (Actions -> Deploy to Bloxity Legion -> Run workflow) to ship any
# branch to one platform.

name: Deploy to Bloxity Legion

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      target:
        description: Platform to deploy to
        type: choice
        options: [staging, prod]
        default: staging

env:
  GAME_ID: 1-slide-downhill
  # Players per room (the Colyseus room's maxClients). Boxity decides how many rooms and
  # how much CPU each pod gets from what it measures, so no seatCap here.
  ROOM_SIZE: 8

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - name: Pick the platforms
        id: pick
        env:
          MANUAL_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || '' }}
          HAS_STAGE_TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN_STAGE != '' }}
        run: |
          if [ -n "$MANUAL_TARGET" ]; then
            list="[\"$MANUAL_TARGET\"]"
          elif [ "$HAS_STAGE_TOKEN" = "true" ]; then
            list='["prod","staging"]'
          else
            list='["prod"]'
          fi
          echo "Deploying to $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  deploy:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    name: deploy (${{ matrix.target }})
    concurrency:
      group: deploy-${{ matrix.target }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      # Each platform has its own token and endpoints; staging never touches prod's.
      DEPLOY_TOKEN: ${{ matrix.target == 'staging' && secrets.LEGION_DEPLOY_TOKEN_STAGE || secrets.LEGION_DEPLOY_TOKEN }}
      API_URL: ${{ matrix.target == 'staging' && 'https://api.stage.bloxity.io' || 'https://api.bloxity.io' }}
      LEGION_URL: ${{ matrix.target == 'staging' && 'https://legion.stage.bloxity.io' || 'https://legion.bloxity.io' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy token
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            if [ "${{ matrix.target }}" = "staging" ]; then
              echo "::error::LEGION_DEPLOY_TOKEN_STAGE is not set. Add it from hosting.stage.bloxity.io to deploy to stage."
            else
              echo "::error::LEGION_DEPLOY_TOKEN is not set. Add it from hosting.bloxity.io."
            fi
            exit 1
          fi

      - name: Channel and image name
        id: meta
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then channel=prod; else channel=dev; fi
          # Per-platform tags, so a staging build never replaces a production image.
          if [ "${{ matrix.target }}" = "staging" ]; then prefix=stage-; else prefix=; fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/$GAME_ID-server:${prefix}$channel-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the server image
        run: |
          docker build -f server/Dockerfile -t "${{ steps.meta.outputs.image }}" .
          docker push "${{ steps.meta.outputs.image }}"

      - name: Roll it out on Legion
        run: |
          curl -sS --fail-with-body -X POST "$LEGION_URL/v1/apps/$GAME_ID/deploy" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"channel\":\"${{ steps.meta.outputs.channel }}\",\"image\":\"${{ steps.meta.outputs.image }}\",\"version\":\"$GITHUB_SHA\",\"roomSize\":$ROOM_SIZE}"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the client
        working-directory: client
        env:
          # The hosting id the client asks Boxity's matchmaker for - not an environment.
          VITE_LEGION_GAME_ID: ${{ env.GAME_ID }}
        run: |
          npm ci
          npm run build

      - name: Upload the frontend to Legion
        run: |
          (cd client/dist && zip -qr ../../build.zip .)
          curl -sS --fail-with-body -X POST \
            "$API_URL/v1/hosting/games/$GAME_ID/frontend?channel=${{ steps.meta.outputs.channel }}&version=$GITHUB_SHA" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H 'Content-Type: application/zip' \
            --data-binary @build.zip
