<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: the game fills the whole screen, notch included; the HUD
         and controls keep clear of it with the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f8ff2" />
    <title>+1 Slide Downhill</title>

    <!-- Bloxity SDK. Exposes itself as window.Legion.SDK. Async so it never blocks the
         first paint; src/bloxity/sdk.js waits for it to appear. -->
    <script async src="https://sdk.bloxity.io/v1/legion-sdk.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
